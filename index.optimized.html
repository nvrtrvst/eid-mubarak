<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid</title>
    
    <!-- Preload critical resources -->
    <link rel="preload" href="css/output.css" as="style">
    <link rel="preload" href="img/optimized/1.webp" as="image" type="image/webp">
    <link rel="preload" href="img/optimized/2.webp" as="image" type="image/webp">
    
    <!-- Font optimization with font-display swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Poppins:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/output.css">
    
    <!-- DNS prefetch for better loading -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
</head>
<body class="bg-green-200 font-poppins">
    <div class="flex flex-wrap items-center justify-center ml-56 relative">
        <div class="container max-w-4xl bg-white rounded shadow-xl m-12">
            <div class="h-96 overflow-hidden rounded-t">
                <picture>
                    <source srcset="img/optimized/1.webp" type="image/webp">
                    <img class="w-full rounded-t-sm -mt-36" src="img/optimized/1.jpg" alt="Eid background" loading="eager" width="1920" height="1280">
                </picture>
            </div>
            <div class="flex justify-center px-5 -mt-24 mb-5">
                <span class="block h-44 w-44">
                    <picture>
                        <source srcset="img/optimized/2.webp" type="image/webp">
                        <img class="mx-auto object-cover rounded-full bg-white p-1.5" src="img/optimized/2.jpg" alt="Profile" loading="eager" width="240" height="358" />
                    </picture>
                </span>
            </div>
            <div class="px-7 mb-8">
                <h1 class="text-8xl font-bold text-green-800 text-center font-almarai">عيد مبارك</h1>
                <h2 class="text-5xl mt-8 font-bold text-green-800 text-center">Eid Mubarak</h2>
                <p class="text-2xl text-center italic text-slate-500 mt-10">May Allah bring us joy, health, happiness, peace and prosperity on this blessed day.</p>
            </div>
        </div>
    </div>

    <div class="box absolute -z-10 top-0"></div>
    
    <!-- Load JavaScript module -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
